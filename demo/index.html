border-color:#a6c9ba;background:#f5faf7}.btn.primary{background:var(--brand);border-color:var(--brand);color:white}.btn.primary:hover:not(:disabled){background:var(--brand-dark)}.btn.danger{color:#9a4141}.btn.ghost{background:transparent}.btn.sm{padding:7px 10px;min-height:32px;font-size:12px}.btn.block{width:100%}.btn.select{background:var(--brand-light);border-color:var(--brand);color:var(--brand-dark)}.btn.option{font-size:25px;min-height:83px;font-weight:780;border-radius:14px}.btn.option.tf{font-size:17px}.btn.option.active{background:var(--brand-light);border:2px solid var(--brand);color:var(--brand-dark)}.input{width:100%;padding:12px 13px;border:1px solid #cbd5dc;border-radius:11px;outline:none;background:white;color:var(--ink);min-width:0}.input:focus{border-color:var(--brand);box-shadow:0 0 0 3px #dff4eb}.label{font-size:12px;font-weight:750;letter-spacing:.07em;color:var(--muted);text-transform:uppercase;display:block;margin-bottom:6px}.divider{border:0;border-top:1px solid var(--line);margin:16px 0}.mutedbox{background:var(--soft);padding:14px;border-radius:13px}.hero{max-width:840px;margin:44px auto}.herohead{text-align:center;margin-bottom:26px}.herohead .pill{margin-bottom:15px}.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.four{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.stat{padding:16px;border-radius:13px;background:var(--soft)}.stat b{display:block;font-size:26px;font-weight:780;letter-spacing:-1px}.stat small{font-size:12px}.chip{border-radius:9px;background:#f1f5f6;padding:7px 10px;font-size:12px;color:#4d6171;font-weight:650;display:inline-flex;gap:6px;align-items:center}.chip.good{color:#126b52;background:#e7f6ec}.chip.pending{color:#8b642c;background:#fff5e5}.code{font-variant-numeric:tabular-nums;font-size:20px;letter-spacing:3px;font-weight:820;color:var(--brand-dark)}.question-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.type-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.type-btn{text-align:left;padding:15px;border:1px solid var(--line);border-radius:12px;background:#fff;min-height:86px}.type-btn:hover{border-color:#8fbdab;background:#f7fcf9}.type-btn strong{display:block;font-size:14px}.type-btn small{font-size:12px;display:block}.type-icon{font-size:20px;display:block;margin-bottom:5px}.section-title{font-size:14px;font-weight:800;margin-bottom:12px}.answer-label{font-size:11px;text-transform:uppercase;color:var(--muted);letter-spacing:.08em;font-weight:750;margin-bottom:10px}.answer-choices{display:flex;gap:7px;flex-wrap:wrap}.answer-choices .btn{min-width:51px}.pair-row{display:flex;align-items:center;justify-content:space-between;margin:8px 0;padding:8px;background:var(--soft);border-radius:10px;gap:9px}.pair-row b{font-size:14px;width:33px}.barrow{display:grid;grid-template-columns:28px minmax(0,1fr) 40px;gap:9px;align-items:center;margin:9px 0}.track{height:11px;background:#eef2f5;border-radius:9px;overflow:hidden}.fill{height:100%;background:#9eafbe;border-radius:9px}.fill.green{background:var(--brand)}.hint{font-size:12px;color:var(--muted)}.response-list{display:grid;gap:7px;margin-top:10px}.name-row{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}.name-row:last-child{border:0}.student-shell{max-width:405px;margin:15px auto 0}.student-shell .panel{padding:18px}.empty-state{text-align:center;padding:30px 18px;color:var(--muted)}.empty-state .emoji{font-size:32px;margin-bottom:10px}.banner{display:flex;gap:10px;align-items:flex-start;background:#eaf5f0;border:1px solid #cce9db;border-radius:12px;color:#195f4a;padding:12px 14px;font-size:13px}.banner.warn{background:#fff9ec;color:#7f602b;border-color:#f2dfbf}.banner.info{background:#eef4fb;color:#355a86;border-color:#d9e5f3}.report-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.report-grid .stat b{color:var(--brand)}.big-number{font-weight:850;font-size:35px;letter-spacing:-1px;line-height:1.25}.table-scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:540px}th,td{padding:11px 10px;border-bottom:1px solid var(--line);text-align:left;font-size:13px;white-space:nowrap}th{font-size:11px;text-transform:uppercase;color:var(--muted);letter-spacing:.04em}td:first-child{font-weight:650}.toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,10px);background:#203543;color:#fff;padding:10px 17px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;z-index:10;font-size:13px;max-width:90vw;text-align:center}.toast.show{opacity:1;transform:translate(-50%,0)}.student-head{margin-bottom:14px}.progress{height:8px;background:#e7edef;border-radius:99px;overflow:hidden}.progress>div{height:100%;background:var(--brand);border-radius:99px}.tiny{font-size:11px}.done{color:var(--brand);font-weight:750}.teacher-intro{margin:4px 0 19px}.notice{background:#fff8eb;border:1px solid #ecd8b1;border-radius:11px;padding:11px 14px;font-size:12px;color:#8a6225;margin-top:16px}.callout{border-left:3px solid var(--brand);padding:9px 12px;background:#f1f8f4;border-radius:0 10px 10px 0;font-size:13px}.kbd{font-family:monospace;background:#f0f2f4;border:1px solid #e0e3e6;border-radius:5px;padding:1px 5px;font-size:12px}.right{display:flex;align-items:center;gap:7px;justify-content:flex-end}.footer{text-align:center;margin-top:22px;font-size:11px;color:#87939d}.stripes{display:grid;gap:6px}.stripe{border:1px solid var(--line);padding:10px;border-radius:10px}.stripe strong{display:block}.line-end{margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}.demo-tools{display:flex;gap:7px;align-items:center}.student-name{font-weight:700}.tight{margin:0}.mt{margin-top:14px}.mb{margin-bottom:14px}.miss{color:#9d632b}.warn-text{color:#9a4d4d}.title-eyebrow{font-size:12px;font-weight:750;color:var(--muted);letter-spacing:.09em;text-transform:uppercase}
@media(max-width:810px){.layout{grid-template-columns:1fr}.container{padding:18px 15px 28px}.topinner{padding:12px 15px}.hero{margin:25px auto}.two{grid-template-columns:1fr}h1{font-size:26px}.student-shell{margin:0 auto}.herohead{text-align:left}}@media(max-width:420px){.four{grid-template-columns:repeat(2,minmax(0,1fr))}.panel{padding:16px}.btn.option{min-height:70px}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.subbrand{display:none}}

/* Sổ đầu bài v2 */
.chips-wrap{display:flex;gap:4px;flex-wrap:wrap;max-width:215px}.mini-choice{border:1px solid #d9e3e7;background:#fff;padding:5px 7px;border-radius:7px;font-size:11px;color:#4b6374;font-weight:600;cursor:pointer;white-space:nowrap}.mini-choice:hover{border-color:#8fc2b0}.mini-choice.chosen{background:#e4f4ec;border-color:#23896e;color:#09614d}.attendance-table{min-width:975px}.attendance-table td{vertical-align:middle;white-space:normal}.attendance-table td:first-child{min-width:135px}.attendance-table th{white-space:nowrap}.compact-input{width:150px;padding:8px;font-size:12px}.roster-add{background:#f7faf9;border:1px dashed #bdcfc8;border-radius:12px;padding:13px}.roster-add summary{cursor:pointer;font-weight:700;color:#235c4d}.roster-add textarea{resize:vertical;margin-top:6px}.parent-page{max-width:850px;margin:6px auto}.report-paper{position:relative;overflow:hidden}.report-accent{position:absolute;top:0;left:0;right:0;height:5px;background:#18846d}.report-info{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.report-info>div{padding:14px;background:#f0f4f5;border-radius:11px}.report-info small{display:block;color:#697b8b;margin-bottom:5px}.report-info strong{font-size:15px}.note-paper{background:#f7faf8;padding:15px 16px;border-radius:12px;min-height:55px;white-space:pre-wrap;overflow-wrap:anywhere}.parent-page h3{font-size:15px}@media(max-width:540px){.report-info{grid-template-columns:1fr}.parent-page .two{grid-template-columns:1fr}}@media print{*{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}body{background:white;font-size:12px}.topbar,.no-print,.toast{display:none!important}.container{width:100%;max-width:100%;padding:0}.parent-page{margin:0;max-width:100%}.report-paper{border:0;box-shadow:none;padding:15mm!important;border-radius:0}.report-info,.report-grid{break-inside:avoid}.report-paper h1{color:#153f34}a{color:inherit;text-decoration:none}@page{size:A4;margin:7mm}}

<body>
<header class="topbar"><div class="topinner"><div><div class="brand"><span>✓</span>LỚP MÌNH LIVE</div><div class="subbrand">Your classroom companion</div></div><div class="demo-tools"><span class="demo-pill">BẢN DEMO NỘI BỘ</span><span class="pill"><span class="dot"></span> LOCAL</span></div></div></header>
<main class="container" id="app"></main><div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
(function(){'use strict';
const PREFIX='lop-minh-live-v2:';
const BC_NAME='lop-minh-live-broadcast-v2';
const channel=('BroadcastChannel' in window)?new BroadcastChannel(BC_NAME):null;
const state={role:'home',roomCode:'',studentId:'',studentName:'',joinCode:'',joinName:'',createName:'Lớp Toán online',keys:{},studentDrafts:{},refresh:0,parentPreviewId:null,rosterDraft:''};
const seed=String(Math.random()).slice(2,8);const now=()=>Date.now();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=n=>String(n??'').trim();
const labelKind={abcd:'Trắc nghiệm A/B/C/D',tf:'Đúng hoặc Sai',tf4:'Đúng/Sai bốn ý',num:'Trả lời ngắn',checkin:'Check-in'};
const types=[['abcd','ABCD','Chọn một đáp án','◩'],['tf','Đúng / Sai','Một nhận định','✓'],['tf4','Đ/S bốn ý','a, b, c, d','⊞'],['num','Điền số','Số nguyên, thập phân, phân số','№']];
const checkins={start:{title:'Check-in đầu giờ',prompt:'Hôm nay con có sẵn sàng học không?',options:['😊 Sẵn sàng','😴 Hơi mệt','🌱 Cần khởi động']},middle:{title:'Check-in giữa giờ',prompt:'Con còn theo kịp bài không?',options:['😊 Con hiểu bài','🤔 Cần chậm lại','🙋 Cần giải thích thêm']},end:{title:'Check-in cuối giờ',prompt:'Con cảm thấy thế nào về bài học hôm nay?',options:['✨ Khá tự tin','🙂 Hiểu phần lớn','🌱 Cần ôn thêm']}};
function getRooms(){try{return JSON.parse(localStorage.getItem(PREFIX+'rooms')||'{}')}catch{return {}}}
function getRoom(){return state.roomCode?getRooms()[state.roomCode]:null}
function saveRoom(room){const rooms=getRooms();rooms[room.code]=room;localStorage.setItem(PREFIX+'rooms',JSON.stringify(rooms));if(channel)channel.postMessage({code:room.code,updatedAt:now()});render()}
function toast(message){const el=document.getElementById('toast');el.textContent=message;el.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove('show'),2400)}
function uid(){return 's'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function createRoom(){const rooms=getRooms();let code;do{code=String(Math.floor(100000+Math.random()*900000))}while(rooms[code]);const room={code,name:norm(state.createName)||'Lớp Toán online',createdAt:now(),status:'live',nextId:1,activeId:null,members:{},activities:[]};state.roomCode=code;state.role='teacher';state.parentPreviewId=null;saveRoom(room);toast('Đã tạo phòng demo '+code)}
function joinStudent(code,name,fromPreview){code=norm(code).replace(/\D/g,'');name=norm(name);if(!code||!name){toast('Vui lòng nhập mã lớp và tên');return}const room=getRooms()[code];if(!room){toast('Không tìm thấy mã lớp trên trình duyệt này');return}if(room.status==='ended'){toast('Buổi học này đã kết thúc');return}
let member=Object.values(room.members).find(m=>normalizeName(m.name)===normalizeName(name)&&!m.joinedAt);if(member){member.joinedAt=now()}else{const id=uid();member={id,name,joinedAt:now(),observation:defaultObservation()};room.members[id]=member}
state.roomCode=code;state.studentId=member.id;state.studentName=name;state.role='student';state.studentDrafts={};saveRoom(room);if(fromPreview)toast('Đã tạo học sinh demo để thử thao tác')}
const DEFAULT_OBS={attendance:'unmarked',camera:'unknown',called:'not_called',note:'',parentName:'',parentEmail:'',delivery:'not_sent'};
function defaultObservation(){return {...DEFAULT_OBS}}
function observation(m){return {...DEFAULT_OBS,...(m.observation||{})}}
function normalizeName(s){return norm(s).normalize('NFC').toLocaleLowerCase('vi-VN').replace(/\s+/g,' ')}
function addRoster(){const room=getRoom();if(!room)return;const names=state.rosterDraft.split(/\r?\n/).map(norm).filter(Boolean);if(!names.length){toast('Nhập tên học sinh, mỗi dòng một tên');return}let count=0;for(const name of names.slice(0,80)){if(Object.values(room.members).some(m=>normalizeName(m.name)===normalizeName(name)))continue;const id=uid();room.members[id]={id,name,joinedAt:null,observation:defaultObservation()};count++}state.rosterDraft='';saveRoom(room);toast(count?'Đã thêm '+count+' học sinh vào danh sách':'Các tên này đã có trong danh sách')}
function setObservation(id,field,value){const room=getRoom();if(!room||!room.members[id]||state.role!=='teacher')return;const valid={attendance:['unmarked','present','late','absent','excused'],camera:['unknown','on','off','exempt'],called:['not_called','answered','no_answer']};if(!valid[field]||!valid[field].includes(value))return;const m=room.members[id],o=observation(m);o[field]=o[field]===value?DEFAULT_OBS[field]:value;m.observation=o;saveRoom(room)}
function storeObservationField(id,field,value){const room=getRoom();if(!room||!room.members[id]||state.role!=='teacher')return;if(!['note','parentName','parentEmail'].includes(field))return;const m=room.members[id],o=observation(m);o[field]=norm(value).slice(0,field==='note'?500:150);o.delivery='not_sent';m.observation=o;saveRoom(room)}
function formatDate(t){return new Intl.DateTimeFormat('vi-VN',{timeZone:'Asia/Ho_Chi_Minh',day:'2-digit',month:'2-digit',year:'numeric'}).format(new Date(t||now()))}
const attendanceLabels={unmarked:'Chưa điểm danh',present:'Có mặt',late:'Đến muộn',absent:'Vắng',excused:'Có phép'};
const cameraLabels={unknown:'Chưa kiểm tra',on:'Có bật',off:'Không bật',exempt:'Không yêu cầu'};
const calledLabels={not_called:'Chưa gọi',answered:'Có trả lời',no_answer:'Không trả lời'};

function active(room){return room&&room.activities.find(a=>a.id===room.activeId)||null}
function numberOf(room,act){const i=room.activities.findIndex(a=>a.id===act.id);return room.activities.slice(0,i+1).filter(a=>a.kind!=='checkin').length}
function openActivity(kind,phase){const room=getRoom();if(!room||room.status==='ended')return;if(active(room)){toast('Hãy chốt hoặc bỏ hoạt động hiện tại trước');return}const c=checkins[phase];const a={id:'a'+room.nextId++,kind,phase:kind==='checkin'?phase:null,title:kind==='checkin'?c.title:null,prompt:kind==='checkin'?c.prompt:'Đáp án của em là gì?',options:kind==='checkin'?c.options:null,status:'open',createdAt:now(),closedAt:null,key:null,responses:{}};room.activities.push(a);room.activeId=a.id;state.keys[a.id]=kind==='tf4'?{}:'';saveRoom(room);toast(kind==='checkin'?'Đã gửi '+c.title.toLowerCase():'Đã mở '+labelKind[kind])}
function parseNumeric(s){s=String(s??'').trim().replace(/\s/g,'').replace(/,/g,'.');if(!s)return null;let m=s.match(/^([+-]?(?:\d+(?:\.\d*)?|\.\d+))\/([+-]?(?:\d+(?:\.\d*)?|\.\d+))$/);if(m){const a=Number(m[1]),b=Number(m[2]);return b!==0&&Number.isFinite(a/b)?a/b:null}if(!/^[+-]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return null;const n=Number(s);return Number.isFinite(n)?n:null}
function equal(a,b){if(typeof a!=='number'||typeof b!=='number')return false;return Math.abs(a-b)<=1e-9*Math.max(1,Math.abs(a),Math.abs(b))}
function graded(a,response){if(!response)return false;const v=response.value;if(a.kind==='num'){return equal(parseNumeric(v),parseNumeric(a.key))}if(a.kind==='tf4'){return ['a','b','c','d'].every(k=>v&&v[k]===a.key[k])}return v===a.key}
function correctParts(a,response){if(a.kind!=='tf4'||!response)return null;return ['a','b','c','d'].filter(k=>response.value&&response.value[k]===a.key[k]).length}
function eligibility(room,act,member){return act.status==='graded'&&member.joinedAt!=null&&member.joinedAt<=act.closedAt}
function studentStats(room,member){const qs=room.activities.filter(a=>a.kind!=='checkin'&&eligibility(room,a,member));const answered=qs.filter(a=>a.responses[member.id]);const correct=answered.filter(a=>graded(a,a.responses[member.id]));const ci=room.activities.filter(a=>a.kind==='checkin'&&a.status==='closed'&&member.joinedAt!=null&&member.joinedAt<=a.closedAt);const cis=ci.filter(a=>a.responses[member.id]);return{eligible:qs.length,answered:answered.length,correct:correct.length,checked:cis.length,checkins:ci.length,participation:qs.length?Math.round(answered.length/qs.length*100):null,accuracy:answered.length?Math.round(correct.length/answered.length*100):null}}
function percent(v){return v==null?'—':v+'%'}
function getStatus(room){const gradedQs=room.activities.filter(a=>a.status==='graded');const checked=room.activities.filter(a=>a.kind==='checkin'&&a.status==='closed');return{count:Object.keys(room.members).length,graded:gradedQs.length,checks:checked.length,opened:room.activities.filter(a=>a.kind!=='checkin').length}}
function storeAnswer(value){const room=getRoom(),a=active(room);if(!room||!a||a.status!=='open'||state.role!=='student'||!room.members[state.studentId]){toast('Không có hoạt động đang mở');return}a.responses[state.studentId]={value,at:now()};saveRoom(room)}
function closeActivity(skip=false){const room=getRoom(),a=active(room);if(!a)return;if(a.kind==='checkin'){a.status='closed'}else if(skip){a.status='skipped'}else{const key=state.keys[a.id];if(a.kind==='tf4'){if(!key||!['a','b','c','d'].every(p=>['Đ','S'].includes(key[p]))){toast('Hãy chọn đủ đáp án đúng cho 4 ý');return}}else if(a.kind==='num'){if(parseNumeric(key)===null){toast('Đáp án đúng phải là số hợp lệ');return}}else if(!key){toast('Hãy chọn đáp án đúng trước khi chốt');return}a.key=key;a.status='graded'}a.closedAt=now();room.activeId=null;saveRoom(room);toast(a.status==='graded'?'Đã chốt và chấm câu hỏi':a.status==='skipped'?'Đã bỏ qua câu hỏi':'Đã kết thúc check-in')}
function endClass(){const room=getRoom();if(!room)return;if(active(room)){toast('Hãy chốt hoặc bỏ hoạt động đang mở trước');return}if(!confirm('Kết thúc buổi học? Báo cáo cuối giờ sẽ được hiển thị.'))return;room.status='ended';room.endedAt=now();saveRoom(room)}
function reset(){if(!confirm('Xoá phòng demo này khỏi trình duyệt?'))return;const rooms=getRooms();delete rooms[state.roomCode];localStorage.setItem(PREFIX+'rooms',JSON.stringify(rooms));if(channel)channel.postMessage({code:state.roomCode});state.role='home';state.roomCode='';state.studentId='';state.parentPreviewId=null;state.keys={};state.studentDrafts={};render()}
function linkStudent(){const base=location.href.split('?')[0].split('#')[0];return base+'?room='+encodeURIComponent(state.roomCode)}
function exportCsv(){const room=getRoom();if(!room)return;const header=['Học sinh','Ngày','Điểm danh','Camera (quan sát)','Khi cô gọi','Câu có cơ hội tham gia','Số câu trả lời','Số câu đúng','Tỷ lệ tham gia','Tỷ lệ chính xác','Check-in','Nhận xét giáo viên'];const lines=[header,...Object.values(room.members).map(m=>{const s=studentStats(room,m),o=observation(m);return[m.name,formatDate(room.createdAt),attendanceLabels[o.attendance],cameraLabels[o.camera],calledLabels[o.called],s.eligible,s.answered,s.correct,percent(s.participation),percent(s.accuracy),s.checked+'/'+s.checkins,o.note]})].map(row=>row.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(','));const blob=new Blob(['\ufeff'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');const url=URL.createObjectURL(blob);a.href=url;a.download='lop-minh-live-bao-cao-lop-'+room.code+'.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}

function headline(room,teacher){return `<div class="row wrap mb"><div><div class="title-eyebrow">${teacher?'Bảng điều khiển giáo viên':'Màn hình học sinh'}</div><h1 style="font-size:25px;margin:5px 0">${esc(room.name)}</h1><div class="muted">Mã phòng <span class="code" style="font-size:15px;letter-spacing:1px">${room.code}</span></div></div><div class="actions">${teacher?`<button class="btn sm" data-action="preview">👀 Xem thử như học sinh</button>`:`<button class="btn sm" data-action="teacher">← Về màn hình cô</button>`}<button class="btn sm" data-action="home">Thoát</button></div></div>`}
function home(){return `<div class="hero"><div class="herohead"><div class="pill"><span class="dot"></span> Không cần nhập đề bài</div><h1>Giảng bài theo cách của cô.<br><span style="color:var(--brand)">Cả lớp cùng tương tác.</span></h1><p class="muted" style="font-size:15px">Một cửa sổ nhỏ bên cạnh Zoom/Google Meet. Cô mở lượt trả lời, học sinh chọn đáp án, hệ thống tổng hợp tiến độ.</p></div><div class="two"><section class="panel stack"><div><div class="title-eyebrow">01 · Giáo viên</div><h2 style="margin:7px 0">Tạo lớp học</h2><p class="muted tight">Mở phòng và điều khiển các câu hỏi trực tiếp.</p></div><div><label class="label" for="createName">Tên lớp</label><input id="createName" data-field="createName" class="input" value="${esc(state.createName)}" maxlength="70" placeholder="Ví dụ: Toán 10 tối thứ Hai"></div><button class="btn primary block" data-action="create">+ Tạo phòng học demo</button></section><section class="panel stack"><div><div class="title-eyebrow">02 · Học sinh</div><h2 style="margin:7px 0">Tham gia lớp</h2><p class="muted tight">Nhập mã phòng giáo viên đã tạo.</p></div><div><label class="label" for="joinCode">Mã phòng</label><input id="joinCode" data-field="joinCode" class="input" value="${esc(state.joinCode)}" inputmode="numeric" maxlength="6" placeholder="6 chữ số"></div><div><label class="label" for="joinName">Tên học sinh</label><input id="joinName" data-field="joinName" class="input" value="${esc(state.joinName)}" maxlength="60" placeholder="Ví dụ: Nguyễn Minh Anh"></div><button class="btn primary block" data-action="join">Tham gia phòng học</button></section></div><div class="notice">🔒 Đây là <b>prototype chạy trong trình duyệt</b>, chưa có máy chủ, xác thực giáo viên hay cơ sở dữ liệu. Chỉ dùng dữ liệu thử, không sử dụng tên hoặc kết quả thật của học sinh. Để mở nhiều cửa sổ đồng bộ, chạy file trên cùng một địa chỉ web (origin).</div></div>`}
function keySelector(a){if(a.kind==='abcd'||a.kind==='tf'){const opts=a.kind==='abcd'?['A','B','C','D']:['Đúng','Sai'];return `<div class="answer-label">Đáp án đúng (chọn khi chuẩn bị chốt)</div><div class="answer-choices">${opts.map(v=>`<button class="btn ${state.keys[a.id]===v?'select':''}" data-action="key" data-val="${v}">${v}</button>`).join('')}</div>`}if(a.kind==='tf4'){return `<div class="answer-label">Chọn đáp án đúng cho cả bốn ý</div>${['a','b','c','d'].map(k=>`<div class="pair-row"><b>Ý ${k}</b><div class="actions"><button class="btn sm ${state.keys[a.id]?.[k]==='Đ'?'select':''}" data-action="keypart" data-part="${k}" data-val="Đ">Đúng</button><button class="btn sm ${state.keys[a.id]?.[k]==='S'?'select':''}" data-action="keypart" data-part="${k}" data-val="S">Sai</button></div></div>`).join('')}`}
return `<div><label class="label" for="rightNum">Đáp án đúng</label><input id="rightNum" data-field="rightNum" class="input" placeholder="Ví dụ: 0,5 hoặc 1/2" value="${esc(state.keys[a.id]??'')}"><div class="hint mt">Hỗ trợ số nguyên, số thập phân và phân số.</div></div>`}
function distribution(a){const values=Object.values(a.responses).map(r=>r.value);if(a.kind==='abcd'||a.kind==='tf'||a.kind==='checkin'){const choices=a.kind==='abcd'?['A','B','C','D']:a.kind==='tf'?['Đúng','Sai']:a.options;return `<div class="answer-label mt">Phân bố câu trả lời</div>${choices.map(v=>{const n=values.filter(z=>z===v).length;return `<div class="barrow"><b style="font-size:12px" title="${esc(v)}">${esc(a.kind==='checkin'?v.slice(0,2):v)}</b><div class="track"><div class="fill ${a.key===v?'green':''}" style="width:${values.length?100*n/values.length:0}%"></div></div><span class="muted tiny" style="text-align:right">${n}/${values.length}</span></div>`}).join('')}`}
if(a.kind==='tf4')return `<div class="answer-label mt">Số lượt trả lời đủ bốn ý: ${values.filter(v=>v&&Object.keys(v).length===4).length}</div>`;
return `<div class="answer-label mt">Các kết quả đã gửi (không công bố danh tính)</div><div class="mutedbox" style="font-size:12px;overflow-wrap:anywhere">${values.length?values.map(v=>esc(v)).join(' · '):'Chưa có câu trả lời'}</div>`}
function teacherActive(room,a){const n=Object.keys(a.responses).length,total=Object.keys(room.members).length;const allReady=total>0&&n===total;return `<section class="panel stack"><div class="row wrap"><div><span class="chip pending">● Đang nhận câu trả lời</span><h2 style="margin:9px 0 0">${a.kind==='checkin'?esc(a.title):'Câu '+numberOf(room,a)+' · '+labelKind[a.kind]}</h2></div><span class="chip ${allReady?'good':''}">${n}/${total} đã phản hồi</span></div><div class="mutedbox"><div class="progress"><div style="width:${total?100*n/total:0}%"></div></div><p class="hint" style="margin:8px 0 0">${a.kind==='checkin'?esc(a.prompt):'Học sinh thấy câu hỏi chung: “Đáp án của em là gì?”'}</p></div>${distribution(a)}${a.kind==='checkin'?`<div class="banner info">☑ Check-in không được chấm điểm. Chỉ tổng hợp kết quả toàn lớp.</div><button class="btn primary block" data-action="close">Kết thúc check-in</button>`:`<div class="divider" style="margin:0"></div>${keySelector(a)}<button class="btn primary block" data-action="close">✓ Chốt câu và chấm</button><button class="btn block danger" data-action="skip">Bỏ câu · không tính kết quả</button>`}</section>`}
function controls(room){if(room.status==='ended')return `<div class="banner">✓ Buổi học đã kết thúc. Bạn có thể xem hoặc xuất báo cáo ở bên dưới.</div>`;return `<section class="panel stack"><div><h2 style="margin-bottom:4px">Mở hoạt động mới</h2><p class="muted tight">Không cần gõ câu hỏi. Cô mở một lượt mới ngay lúc cần.</p></div><div class="type-grid">${types.map(([k,t,d,ic])=>`<button class="type-btn" data-action="open" data-kind="${k}"><span class="type-icon">${ic}</span><strong>${t}</strong><small>${d}</small></button>`).join('')}</div><div class="divider" style="margin:0"></div><div class="section-title" style="margin:0">Check-in nhanh</div><div class="three">${[['start','🌤️ Đầu giờ'],['middle','☕ Giữa giờ'],['end','🌿 Cuối giờ']].map(([k,t])=>`<button class="btn" data-action="checkin" data-phase="${k}">${t}</button>`).join('')}</div></section>`}
function members(room){const all=Object.values(room.members),joined=all.filter(m=>m.joinedAt!=null);return `<section class="panel"><div class="row"><h3 style="margin:0">Học sinh đã vào web (${joined.length}/${all.length})</h3><span class="chip">Demo</span></div>${joined.length?`<div class="response-list">${joined.map(m=>{const s=studentStats(room,m);return `<div class="name-row"><span>${esc(m.name)}</span><span class="muted">${s.answered}/${s.eligible} câu</span></div>`}).join('')}</div>`:`<div class="empty-state"><div class="emoji">👋</div>Chưa có học sinh vào web.<br><small>Danh sách điểm danh có thể thêm trước giờ học.</small></div>`}</section>`}
function optionGroup(m,field,options){const obs=observation(m);return `<div class="chips-wrap">${options.map(([value,label])=>`<button type="button" class="mini-choice ${obs[field]===value?'chosen':''}" data-action="observe" data-mid="${esc(m.id)}" data-field="${field}" data-value="${value}" title="${esc(label)}">${esc(label)}</button>`).join('')}</div>`}
function attendancePanel(room){const all=Object.values(room.members);const present=all.filter(m=>['present','late'].includes(observation(m).attendance)).length;const unknown=all.filter(m=>observation(m).attendance==='unmarked').length;return `<section class="panel stack"><div class="row wrap"><div><div class="title-eyebrow">Theo dõi lớp học</div><h2 style="margin:5px 0 0">Điểm danh & tương tác</h2></div><div class="actions"><span class="chip good">${present} có mặt / muộn</span><span class="chip pending">${unknown} chưa kiểm tra</span></div></div><div class="hint">Cô tick thủ công trong giờ học. Camera là trạng thái cô quan sát tại thời điểm kiểm tra, không phải dữ liệu webcam. “Chưa gọi” không đồng nghĩa với “không trả lời”.</div><details class="roster-add"><summary>+ Thêm danh sách học sinh trước buổi học</summary><label class="label mt" for="rosterDraft">Mỗi dòng một tên; học sinh vào web đúng tên sẽ được ghép với danh sách</label><textarea class="input" rows="3" id="rosterDraft" data-field="rosterDraft" placeholder="Nguyễn Minh Anh&#10;Trần Đức Minh">${esc(state.rosterDraft)}</textarea><button class="btn sm primary mt" data-action="addRoster">Thêm vào danh sách</button><div class="hint mt">Đừng dùng dữ liệu cá nhân thật trong bản demo này.</div></details>${all.length?`<div class="table-scroll"><table class="attendance-table"><thead><tr><th>Học sinh</th><th>Điểm danh</th><th>Camera</th><th>Khi cô gọi</th><th>Nhận xét nhanh</th><th>Báo cáo</th></tr></thead><tbody>${all.map(m=>{const o=observation(m);return `<tr><td><strong>${esc(m.name)}</strong><div class="tiny muted">${m.joinedAt?'Đã vào web':'Chưa vào web'}</div></td><td>${optionGroup(m,'attendance',[['present','Có mặt'],['late','Muộn'],['absent','Vắng'],['excused','Có phép']])}</td><td>${optionGroup(m,'camera',[['on','Bật'],['off','Tắt'],['exempt','Miễn']])}</td><td>${optionGroup(m,'called',[['answered','Trả lời'],['no_answer','Không trả lời']])}</td><td><input class="input compact-input" data-field="obsNote" data-mid="${esc(m.id)}" value="${esc(o.note)}" maxlength="500" placeholder="Ghi chú ngắn..."></td><td><button class="btn sm" data-action="parentPreview" data-mid="${esc(m.id)}">Xem PH ›</button></td></tr>`}).join('')}</tbody></table></div>`:`<div class="empty-state">Chưa có tên nào trong danh sách.<div class="hint mt">Cô thêm danh sách đầu giờ hoặc để học sinh vào bằng mã phòng.</div></div>`}</section>`}
function reportTeacher(room){const all=Object.values(room.members);const count=room.activities.filter(a=>a.status==='graded').length;const joined=all.filter(m=>m.joinedAt!=null);const avg=joined.length?Math.round(joined.reduce((n,m)=>n+(studentStats(room,m).participation??0),0)/joined.length):null;return `<section class="panel stack"><div class="row wrap"><div><div class="title-eyebrow">Tổng hợp buổi học</div><h2 style="margin:5px 0">Báo cáo giáo viên</h2></div><button class="btn sm" data-action="csv">↓ Xuất bảng CSV</button></div><div class="three"><div class="stat"><b>${count}</b><small>Câu đã chấm</small></div><div class="stat"><b>${all.length}</b><small>Sĩ số danh sách</small></div><div class="stat"><b>${percent(avg)}</b><small>Tham gia trung bình của HS vào web</small></div></div>${all.length?`<div class="table-scroll"><table><thead><tr><th>Học sinh</th><th>Điểm danh</th><th>Camera</th><th>Khi cô gọi</th><th>Đã trả lời</th><th>Đúng</th><th>Tham gia</th><th>Chính xác</th><th>PH</th></tr></thead><tbody>${all.map(m=>{const s=studentStats(room,m),o=observation(m);return `<tr><td>${esc(m.name)}</td><td>${attendanceLabels[o.attendance]}</td><td>${cameraLabels[o.camera]}</td><td>${calledLabels[o.called]}</td><td>${s.answered}/${s.eligible}</td><td>${s.correct}/${s.answered}</td><td>${percent(s.participation)}</td><td>${percent(s.accuracy)}</td><td><button class="btn sm" data-action="parentPreview" data-mid="${esc(m.id)}">Xem</button></td></tr>`}).join('')}</tbody></table></div>`:`<p class="muted">Chưa có học sinh.</p>`}<div class="hint">Báo cáo lớp chỉ dành cho giáo viên. Báo cáo PH tách riêng từng học sinh; cần duyệt trước khi gửi.</div></section>`}
function parentMessage(room,m){const st=studentStats(room,m),o=observation(m);return `Kính gửi Quý Phụ huynh${o.parentName?' '+o.parentName:''},\n\nCô gửi thông tin buổi học ${room.name} ngày ${formatDate(room.createdAt)} của con ${m.name}:\n- Điểm danh: ${attendanceLabels[o.attendance]}.\n- Camera (quan sát của cô): ${cameraLabels[o.camera]}.\n- Khi được gọi: ${calledLabels[o.called]}.\n- Tham gia trả lời: ${st.answered}/${st.eligible} lượt hợp lệ (${percent(st.participation)}).\n- Trả lời chính xác: ${st.correct}/${st.answered} (${percent(st.accuracy)}).\n- Check-in đã thực hiện: ${st.checked}/${st.checkins}.\n${o.note?'\nNhận xét của cô: '+o.note+'\n':''}\nCác tỷ lệ phản ánh hoạt động tương tác trên web, không phải tỷ lệ kiến thức đã nắm vững.\n\nCảm ơn Quý Phụ huynh đã đồng hành cùng cô và các con.`.replace(/\\n/g,'\n')}
function parentReportPage(room,m){const st=studentStats(room,m),o=observation(m);return `<div class="parent-page"><div class="row wrap no-print" style="margin-bottom:16px"><button class="btn" data-action="backTeacher">← Quay về quản lý lớp</button><span class="chip pending">Bản xem trước · Chưa tự động gửi</span></div><div class="report-paper panel"><div class="report-accent"></div><div class="row wrap"><div><div class="title-eyebrow">LỚP MÌNH LIVE · BÁO CÁO CÁ NHÂN</div><h1 style="font-size:25px;margin:7px 0">BÁO CÁO BUỔI HỌC</h1><div class="muted">${esc(room.name)} · ${formatDate(room.createdAt)}</div></div><span class="chip">Dành riêng cho phụ huynh</span></div><div class="divider"></div><div class="row wrap"><div><div class="label">Học sinh</div><h2 style="margin:4px 0">${esc(m.name)}</h2></div><div class="muted" style="font-size:12px">Báo cáo cá nhân, không bao gồm thông tin của học sinh khác</div></div><h3 style="margin:16px 0 10px">1. Nề nếp trong buổi học</h3><div class="report-info"><div><small>Điểm danh</small><strong>${attendanceLabels[o.attendance]}</strong></div><div><small>Camera (cô quan sát)</small><strong>${cameraLabels[o.camera]}</strong></div><div><small>Khi cô gọi</small><strong>${calledLabels[o.called]}</strong></div></div><h3 style="margin:20px 0 10px">2. Tham gia học tập</h3><div class="report-grid"><div class="stat"><small>Tỷ lệ tham gia</small><b>${percent(st.participation)}</b><small>${st.answered}/${st.eligible} câu</small></div><div class="stat"><small>Tỷ lệ chính xác</small><b>${percent(st.accuracy)}</b><small>${st.correct}/${st.answered} câu đúng</small></div></div><p class="hint mt">Check-in: ${st.checked}/${st.checkins} lượt. Không tính check-in vào tỷ lệ chính xác.</p><h3 style="margin:20px 0 10px">3. Nhận xét của giáo viên</h3><div class="note-paper">${o.note?esc(o.note):'<span class="muted">Chưa có nhận xét riêng cho buổi học này.</span>'}</div><div class="divider"></div><p class="hint">Lưu ý: Báo cáo thể hiện các quan sát thủ công của giáo viên và số lượt trả lời trên web. Đây không phải thước đo toàn bộ năng lực, mức độ tập trung hay phần trăm kiến thức học sinh đã nắm.</p><div class="tiny muted" style="text-align:right">Lớp Mình Live · ${formatDate(room.endedAt||now())}</div></div><section class="panel stack no-print" style="margin-top:16px"><div><h3 style="margin-bottom:6px">Duyệt thông tin & gửi phụ huynh</h3><p class="hint tight">Bước này chỉ tạo tài liệu và nội dung tin nhắn. Demo chưa kết nối dịch vụ gửi tự động.</p></div><div class="two"><div><label class="label" for="guardianName">Tên phụ huynh (không bắt buộc)</label><input id="guardianName" class="input" data-field="parentName" data-mid="${esc(m.id)}" value="${esc(o.parentName)}" placeholder="Phụ huynh của con..."></div><div><label class="label" for="guardianEmail">Email phụ huynh (nếu gửi email)</label><input id="guardianEmail" class="input" data-field="parentEmail" data-mid="${esc(m.id)}" value="${esc(o.parentEmail)}" placeholder="phuhuynh@example.com" type="email"></div></div><div><label class="label" for="guardianNote">Nhận xét riêng của cô</label><textarea id="guardianNote" rows="3" class="input" data-field="note" data-mid="${esc(m.id)}" placeholder="Nhận xét mang tính xây dựng, dựa trên quan sát...">${esc(o.note)}</textarea><div class="hint mt">Chỉnh sửa xong, nhấp ra ngoài ô để lưu và cập nhật báo cáo.</div></div><div class="actions"><button class="btn primary" data-action="printReport">↧ In / Lưu PDF</button><button class="btn" data-action="copyParent">⧉ Sao chép tin nhắn gửi Zalo</button><button class="btn" data-action="emailParent">✉ Soạn email cho PH</button></div><div class="banner warn">Bản demo không gửi tin nhắn tự động, không có cơ chế bảo mật tài khoản hoặc đồng bộ giữa các thiết bị. Không nhập thông tin thật của học sinh hoặc phụ huynh tại đây.</div></section></div>`}
function teacher(room){const selected=state.parentPreviewId&&room.members[state.parentPreviewId];if(selected)return parentReportPage(room,selected);const st=getStatus(room),a=active(room);return `${headline(room,true)}<div class="layout"><div class="stack"><div class="four"><div class="stat"><b>${st.count}</b><small>Sĩ số danh sách</small></div><div class="stat"><b>${st.opened}</b><small>Lượt đã mở</small></div><div class="stat"><b>${st.graded}</b><small>Đã chấm</small></div><div class="stat"><b>${st.checks}</b><small>Check-in</small></div></div>${a?teacherActive(room,a):controls(room)}</div><div class="stack"><section class="panel stack"><div class="title-eyebrow">Chia sẻ mã lớp</div><div class="row"><div class="code">${room.code}</div><button class="btn sm" data-action="copy">⧉ Sao chép</button></div><div class="hint">Danh sách lớp và điểm danh được theo dõi riêng, không phụ thuộc hoàn toàn vào người đã vào web.</div></section>${members(room)}<section class="panel stack"><h3 style="margin:0">Quản lý buổi học</h3>${room.status==='live'?`<button class="btn block" data-action="end">Kết thúc buổi học & tạo báo cáo</button>`:`<div class="banner">✓ Buổi học đã kết thúc. Cô có thể rà soát và xuất báo cáo riêng cho từng PH.</div>`}<button class="btn block danger" data-action="reset">Xoá dữ liệu demo</button><div class="hint">Chưa có gửi email/Zalo tự động; không sử dụng thông tin cá nhân thật trong bản demo.</div></section></div></div><div class="stack" style="margin-top:18px">${attendancePanel(room)}${reportTeacher(room)}</div>`}
function studentAnswer(room,a,m){const own=a.responses[m.id]?.value;const draft=state.studentDrafts[a.id]||{};if(a.kind==='checkin')return `<div class="stack" style="gap:9px">${a.options.map(o=>`<button class="btn block ${own===o?'select':''}" style="text-align:left;min-height:49px" data-action="answer" data-value="${esc(o)}">${esc(o)} ${own===o?' ✓':''}</button>`).join('')}</div>`;
if(a.kind==='abcd'||a.kind==='tf'){const opts=a.kind==='abcd'?['A','B','C','D']:['Đúng','Sai'];return `<div class="question-grid">${opts.map(v=>`<button class="btn option ${a.kind==='tf'?'tf':''} ${own===v?'active':''}" data-action="answer" data-value="${v}">${v}</button>`).join('')}</div>`}
if(a.kind==='tf4'){const all=draft&&Object.keys(draft).length?draft:(own||{});return `<div class="hint" style="margin-bottom:12px">Chọn Đúng hoặc Sai cho cả bốn ý. Khi đủ 4 ý, hệ thống tự ghi nhận.</div>${['a','b','c','d'].map(k=>`<div class="pair-row"><b>Ý ${k}</b><div class="actions"><button class="btn ${all[k]==='Đ'?'select':''}" data-action="part" data-part="${k}" data-value="Đ">Đúng</button><button class="btn ${all[k]==='S'?'select':''}" data-action="part" data-part="${k}" data-value="S">Sai</button></div></div>`).join('')}`}
return `<div class="stack" style="gap:10px"><input data-field="numberDraft" class="input" value="${esc(state.studentDrafts[a.id]??own??'')}" placeholder="Ví dụ: -2 hoặc 0,5 hoặc 1/2" inputmode="decimal"><button class="btn primary block" data-action="number">Gửi đáp án</button><div class="hint">Chỉ nhập kết quả bằng số.</div></div>`}
function studentActive(room,a,m){const own=a.responses[m.id];return `<section class="panel stack student-head"><div class="row"><span class="pill"><span class="dot"></span> Cô vừa mở hoạt động</span><span class="chip">${a.kind==='checkin'?'Check-in':'Câu '+numberOf(room,a)}</span></div><div><div class="title-eyebrow">${a.kind==='checkin'?esc(a.title):esc(labelKind[a.kind])}</div><h2 style="margin:8px 0 0">${esc(a.prompt)}</h2></div>${studentAnswer(room,a,m)}<div class="banner ${own?'':'info'}">${own?'✓ Đã ghi nhận câu trả lời của con. Con có thể thay đổi cho đến khi cô chốt.':'Chọn một đáp án để gửi tới cô.'}</div></section>`}
function studentReport(room,m,ended){const s=studentStats(room,m);const last=[...room.activities].reverse().find(a=>a.status==='graded'&&a.responses[m.id]);return `<section class="panel stack"><div><div class="title-eyebrow">${ended?'Báo cáo cuối giờ':'Tiến độ hiện tại'}</div><h2 style="margin:5px 0">${ended?'Hôm nay con học thế nào?':'Cùng theo dõi nhé!'}</h2></div><div class="report-grid"><div class="stat"><small>Tỷ lệ tham gia</small><b>${percent(s.participation)}</b><small>${s.answered}/${s.eligible} câu đã chấm</small></div><div class="stat"><small>Tỷ lệ chính xác</small><b>${percent(s.accuracy)}</b><small>${s.correct}/${s.answered} câu trả lời</small></div></div><div class="mutedbox"><div class="row"><span>Check-in hoàn thành</span><b>${s.checked}/${s.checkins}</b></div><div class="progress" style="margin-top:9px"><div style="width:${s.checkins?100*s.checked/s.checkins:0}%"></div></div></div>${last?`<div class="banner ${graded(last,last.responses[m.id])?'':'info'}">${graded(last,last.responses[m.id])?'✓':'ℹ'} Lượt được chấm gần nhất: <b>${graded(last,last.responses[m.id])?'Chính xác!':'Chưa chính xác'}</b>${last.kind==='tf4'?` (${correctParts(last,last.responses[m.id])}/4 ý đúng)`:''}.</div>`:''}${ended?`<div class="callout">🌱 Cảm ơn con đã tham gia! Báo cáo này phản ánh mức độ tham gia trả lời, không phải tỷ lệ kiến thức con đã nắm vững.</div>`:`<div class="hint">Phần trăm chỉ tính các câu đã được cô chốt và chấm. Các câu bị bỏ qua không tính.</div>`}</section>`}
function student(room){let m=room.members[state.studentId];if(!m){state.role='home';return home()}const a=active(room);return `<div class="student-shell">${headline(room,false)}<div class="row mb"><div>Xin chào, <span class="student-name">${esc(m.name)}</span> 👋</div><span class="chip ${room.status==='ended'?'':'good'}">${room.status==='ended'?'Đã kết thúc':'Đang học'}</span></div><div class="stack">${room.status==='ended'?studentReport(room,m,true):a?studentActive(room,a,m):`<section class="panel empty-state"><div class="emoji">☕</div><h3 style="color:var(--ink);margin-bottom:4px">Đang chờ câu hỏi tiếp theo</h3><p class="muted tight">Khi cô mở lượt mới, bảng trả lời sẽ xuất hiện ở đây.</p></section>`}${room.status==='ended'||!a?room.status==='ended'?'':studentReport(room,m,false):`<div class="panel"><div class="title-eyebrow">Tiến độ hôm nay</div><div class="row" style="margin-top:6px"><b>${studentStats(room,m).answered} câu đã trả lời và chấm</b><span class="chip">${percent(studentStats(room,m).participation)}</span></div></div>`}</div><p class="footer">Lớp Mình Live · Giao diện gọn cho cửa sổ laptop</p></div>`}
function render(){const room=getRoom();const root=document.getElementById('app');if(!room||state.role==='home'){root.innerHTML=home();return}root.innerHTML=state.role==='teacher'?teacher(room):student(room)}
function actOnClick(el){const action=el.dataset.action;const room=getRoom();switch(action){case 'create':createRoom();break;case 'join':joinStudent(state.joinCode,state.joinName);break;case 'preview':if(!room)return;if(state.studentId&&room.members[state.studentId]){state.role='student';render()}else joinStudent(room.code,'Học sinh demo',true);break;case 'teacher':state.role='teacher';state.parentPreviewId=null;render();break;case 'home':state.role='home';state.parentPreviewId=null;render();break;case 'open':openActivity(el.dataset.kind);break;case 'checkin':openActivity('checkin',el.dataset.phase);break;case 'answer':storeAnswer(el.dataset.value);break;case 'part':{const a=active(room);if(!a)return;const old=state.studentDrafts[a.id]||a.responses[state.studentId]?.value||{};const d={...old,[el.dataset.part]:el.dataset.value};state.studentDrafts[a.id]=d;if(['a','b','c','d'].every(p=>d[p])){storeAnswer(d)}else render();break}case 'number':{const a=active(room);if(!a)return;const v=state.studentDrafts[a.id]??'';if(parseNumeric(v)===null){toast('Vui lòng nhập một số hợp lệ');return}storeAnswer(v);break}case 'key':{const a=active(room);if(!a)return;state.keys[a.id]=el.dataset.val;render();break}case 'keypart':{const a=active(room);if(!a)return;state.keys[a.id]={...(state.keys[a.id]||{}),[el.dataset.part]:el.dataset.val};render();break}case 'close':closeActivity(false);break;case 'skip':closeActivity(true);break;case 'end':endClass();break;case 'copy':{const code=room?.code||'';if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(code).then(()=>toast('Đã sao chép mã lớp'),()=>toast('Mã lớp: '+code))}else toast('Mã lớp: '+code);break}case 'csv':exportCsv();break;case 'reset':reset();break;
case 'addRoster':addRoster();break;
case 'observe':setObservation(el.dataset.mid,el.dataset.field,el.dataset.value);break;
case 'parentPreview':state.parentPreviewId=el.dataset.mid;render();window.scrollTo(0,0);break;
case 'backTeacher':state.parentPreviewId=null;render();window.scrollTo(0,0);break;
case 'printReport':window.print();break;
case 'copyParent':{const m=room?.members[state.parentPreviewId];if(!m)return;const txt=parentMessage(room,m);if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(txt).then(()=>toast('Đã sao chép tin nhắn cá nhân'),()=>toast('Không sao chép được; cần mở trên HTTPS / localhost'))}else{const t=document.createElement('textarea');t.value=txt;document.body.appendChild(t);t.select();const ok=document.execCommand('copy');t.remove();toast(ok?'Đã sao chép tin nhắn':'Không sao chép được, cần mở bằng HTTPS')}break}
case 'emailParent':{const m=room?.members[state.parentPreviewId];if(!m)return;const email=observation(m).parentEmail;if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){toast('Hãy nhập email PH hợp lệ rồi nhấp ra ngoài ô');return}const subject=`Báo cáo buổi học ${room.name} - ${formatDate(room.createdAt)} - ${m.name}`;window.location.href='mailto:'+encodeURIComponent(email)+'?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(parentMessage(room,m));toast('Đã mở ứng dụng email để cô kiểm tra và gửi');break}
}}
document.addEventListener('click',e=>{const btn=e.target.closest('[data-action]');if(btn&&!btn.disabled)actOnClick(btn)});
document.addEventListener('input',e=>{const f=e.target.dataset.field;if(!f)return;switch(f){case 'createName':state.createName=e.target.value;break;case 'joinCode':state.joinCode=e.target.value;break;case 'joinName':state.joinName=e.target.value;break;case 'rightNum':{const a=active(getRoom());if(a)state.keys[a.id]=e.target.value;break}case 'numberDraft':{const a=active(getRoom());if(a)state.studentDrafts[a.id]=e.target.value;break}case 'rosterDraft':state.rosterDraft=e.target.value;break}});
document.addEventListener('change',e=>{const f=e.target.dataset.field;if(['obsNote','note','parentName','parentEmail'].includes(f)){storeObservationField(e.target.dataset.mid,f==='obsNote'?'note':f,e.target.value)}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&state.role==='home'&&e.target.id==='joinName')joinStudent(state.joinCode,state.joinName)});
window.addEventListener('storage',e=>{if(e.key===PREFIX+'rooms'&&state.roomCode)render()});if(channel)channel.onmessage=e=>{if(e.data?.code===state.roomCode)render()};
const urlRoom=new URLSearchParams(location.search).get('room');if(urlRoom&&getRooms()[urlRoom]){state.joinCode=urlRoom}
render();
})();
</script>
</body>
</html>
